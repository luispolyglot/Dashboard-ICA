<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ICA" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>ICA</title>
    <!--
      Sin destello blanco al abrir o recargar: antes de que cargue nada, la página ya tiene el
      fondo de la app y, en modo oscuro, la clase «dark» (así la pantalla de carga de React
      también sale oscura). Mismo criterio que ThemeContext: lo guardado o, si no, el sistema.
    -->
    <style>
      html { background: #eef3f8; color-scheme: light; }
      html.dark { background: oklch(20.5% 0.03 245); color-scheme: dark; }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('dashboard-ica-theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.dataset.theme = 'dark'
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#0b1621')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <!-- Pantalla de carga: el logo ICA en el centro hasta que arranca la app (React la sustituye). -->

            <path d="M44 0 L44 26" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
            <rect x="38" y="24" width="12" height="16" rx="5" fill="currentColor" />

        </svg>
      </div>
      <style>
        @keyframes ica-splash-in { from { opacity: 0; transform: scale(.94) } to { opacity: 1; transform: scale(1) } }
        @media (prefers-reduced-motion: reduce) { #ica-splash svg { animation: none !important } }
      </style>
      <script>
        (function () {
          try {
            var stored = localStorage.getItem('dashboard-ica-theme')
            var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
            if (dark) {
              var el = document.getElementById('ica-splash')
              el.style.background = 'oklch(20.5% 0.03 245)'
              el.style.color = '#1597cc'
              el.style.setProperty('--ica-splash-bg', 'oklch(20.5% 0.03 245)')
            }
          } catch (e) {}
        })()
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
